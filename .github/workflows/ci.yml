name: CI

on:
  push:
    branches: [main]
  pull_request:

# The SDL front end is never opened in CI, so nothing here needs a display; the
# tests exercise Vxp.Core and the CLI, both of which are headless by design.
env:
  # Directory.Build.props already sets InvariantGlobalization, so the build and
  # the tests never touch ICU. Saying so here means the dotnet CLI itself does
  # not either, which keeps the Linux leg working on a minimal runner image.
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted for now. The self-hosted runners (arc pods for Linux, the
        # win11 KubeVirt guest) are free where these are metered, and go back in
        # here once they are working again.
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
