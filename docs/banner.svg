<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="vxp: a VideoNow XP emulator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212b"/>
      <stop offset="0.55" stop-color="#0e1620"/>
      <stop offset="1" stop-color="#070c11"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd2e3"/>
      <stop offset="0.5" stop-color="#f2a33c"/>
      <stop offset="1" stop-color="#4fd2e3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a33c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2a33c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4fd2e3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="250" rx="18" fill="url(#bg)"/>

  <!-- LCD scanlines -->
  <g fill="#ffffff" opacity="0.03">
    <rect x="0" y="0" width="1200" height="2"/>
    <rect x="0" y="8" width="1200" height="2"/>
    <rect x="0" y="16" width="1200" height="2"/>
    <rect x="0" y="226" width="1200" height="2"/>
    <rect x="0" y="234" width="1200" height="2"/>
    <rect x="0" y="242" width="1200" height="2"/>
  </g>

  <!-- the disc: a small pressed CD read as raw audio sectors -->
  <g transform="translate(600 76)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#disc)" stroke-width="5"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#f2a33c" stroke-width="1.5" opacity="0.45"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#4fd2e3" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="11" fill="#070c11" stroke="#8fa3b0" stroke-width="2"/>
    <!-- the 9:1 interleave, nine video bytes then one audio byte -->
    <g fill="#f2a33c">
      <rect x="-96" y="-4" width="6" height="8"/>
      <rect x="-86" y="-4" width="6" height="8"/>
      <rect x="-76" y="-4" width="6" height="8"/>
      <rect x="76" y="-4" width="6" height="8"/>
      <rect x="86" y="-4" width="6" height="8"/>
      <rect x="96" y="-4" width="6" height="8"/>
    </g>
    <g fill="#4fd2e3">
      <rect x="-66" y="-4" width="6" height="8"/>
      <rect x="66" y="-4" width="6" height="8"/>
    </g>
  </g>

  <text x="600" y="176" text-anchor="middle"
        font-family="Verdana, DejaVu Sans, Geneva, sans-serif" font-size="82" font-weight="bold"
        fill="#eef6fa" letter-spacing="4">vxp</text>

  <text x="600" y="208" text-anchor="middle"
        font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="18"
        fill="#8fa3b0" letter-spacing="5">VIDEONOW XP &#183; VIDEONOW COLOR &#183; 144&#215;80</text>

  <rect x="370" y="226" width="460" height="2" fill="url(#glow)"/>
</svg>
